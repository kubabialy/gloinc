name: Compiler CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superseded-release-runs:
    name: Cancel superseded 0.2.2 validation runs
    if: >-
      github.repository == 'kubabialy/gloinc' &&
      (github.ref == 'refs/heads/release/0.2.2' ||
      (github.event_name == 'pull_request' && github.head_ref == 'release/0.2.2' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Keep validation for the current release head
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$CANDIDATE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          current_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/0.2.2" --jq .object.sha)
          [[ "$current_head" == "$CANDIDATE_HEAD" ]] || exit 0
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=release%2F0.2.2&per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha != \"$CANDIDATE_HEAD\" and .status != \"completed\") | .id" \
            > superseded-runs.txt
          while read -r run_id; do
            [[ "$run_id" =~ ^[0-9]+$ ]]
            current_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/0.2.2" --jq .object.sha)
            [[ "$current_head" == "$CANDIDATE_HEAD" ]] || exit 0
            # A concurrent cleanup or a just-finished job may already have ended it.
            if ! gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY"; then
              echo "::notice::Could not cancel run $run_id; current-head validation continues."
            fi
          done < superseded-runs.txt

  linux:
    name: Ubuntu 24.04 ${{ matrix.arch }} / LLVM 21.1.8
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    # Fresh build, both package matrices, and serial/parallel complete audits.
    # Individual CTest and child-process deadlines remain separately bounded.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install build tools and pinned LLVM/MLIR
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cmake ninja-build g++ openssl libssl-dev
          bash scripts/install-llvm-linux.sh

      - name: Record environment
        run: |
          mkdir -p ci-reports-linux
          {
            uname -a
            cmake --version
            ninja --version
            "$GLOIN_LLVM_PREFIX/bin/llvm-config" --version
          } | tee ci-reports-linux/environment.log

      - name: Build compiler and tests
        id: build
        run: |
          cmake -S . -B build-ci-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DLLVM_DIR="$GLOIN_LLVM_PREFIX/lib/cmake/llvm" \
            -DMLIR_DIR="$GLOIN_LLVM_PREFIX/lib/cmake/mlir" \
            2>&1 | tee ci-reports-linux/configure.log
          cmake --build build-ci-linux -j 2 2>&1 | tee ci-reports-linux/build.log
          ctest --test-dir build-ci-linux --show-only=json-v1 > ci-reports-linux/inventory.json

      - name: Check Gloin source style
        run: build-ci-linux/gloinfmt --check .

      - name: Check documentation links
        run: build-ci-linux/gloin-check-docs

      - name: Verify executable core acceptance
        id: core
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          core_status=0
          cmake --build build-ci-linux --target check-core 2>&1 | tee ci-reports-linux/core.log || core_status=$?
          if [[ -f build-ci-linux/core.xml ]]; then cp build-ci-linux/core.xml ci-reports-linux/core.xml; fi
          test "$core_status" -eq 0

      - name: Verify installation and relocated Linux package
        id: package
        if: ${{ !cancelled() && steps.core.outcome == 'success' }}
        run: |
          bash scripts/check-package.sh build-ci-linux ci-reports-linux/package \
            2>&1 | tee ci-reports-linux/package.log

      - name: Classify complete suite
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          set +e
          ctest --test-dir build-ci-linux -j 1 --output-on-failure \
            --output-junit "$PWD/ci-reports-linux/serial.xml" 2>&1 | tee ci-reports-linux/serial.log
          serial_status=${PIPESTATUS[0]}
          ctest --test-dir build-ci-linux -j 4 --output-on-failure \
            --output-junit "$PWD/ci-reports-linux/parallel.xml" 2>&1 | tee ci-reports-linux/parallel.log
          parallel_status=${PIPESTATUS[0]}
          set -e
          test "$serial_status" -ne 0 && test "$parallel_status" -ne 0
          build-ci-linux/gloin-check-suite ci-reports-linux/serial.xml ci-reports-linux/parallel.xml

      - name: Publish Linux build and test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: compiler-linux-${{ matrix.arch }}-ci-reports
          retention-days: 14
          if-no-files-found: error
          path: |
            ci-reports-linux/
            build-ci-linux/Testing/Temporary/
            build-ci-linux/compile_commands.json
            build-ci-linux/CMakeCache.txt

  macos:
    name: macOS 15 arm64 / LLVM 21.1.6
    runs-on: macos-15
    # Three builds, package matrices, sanitizers, and both full-suite audits.
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Prepare clean build and report directories
        run: |
          test ! -e build-ci
          test ! -e build-ci-no-tests
          test ! -e build-ci-sanitized
          mkdir -p ci-reports

      - name: Install build tools and pinned LLVM/MLIR
        run: |
          brew install cmake ninja openssl@3
          bash scripts/install-llvm.sh 2>&1 | tee ci-reports/toolchain-install.log

      - name: Record environment
        run: |
          {
            sw_vers
            uname -m
            /usr/bin/clang++ --version
            cmake --version
            ninja --version
            "$GLOIN_LLVM_PREFIX/bin/llvm-config" --version
          } | tee ci-reports/environment.log

      - name: Build without test dependencies
        run: |
          cmake -S . -B build-ci-no-tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DLLVM_DIR="$GLOIN_LLVM_PREFIX/lib/cmake/llvm" \
            -DMLIR_DIR="$GLOIN_LLVM_PREFIX/lib/cmake/mlir" \
            2>&1 | tee ci-reports/configure-no-tests.log
          cmake --build build-ci-no-tests -j 2 2>&1 | tee ci-reports/build-no-tests.log
          test ! -e build-ci-no-tests/_deps
          test ! -e build-ci-no-tests/gloinc_test
          program_status=0
          result=$(build-ci-no-tests/gloinc --jit examples/core_counter.gloin) || program_status=$?
          test "$program_status" = 42
          test -z "$result"
          result=$(build-ci-no-tests/gloinc --jit examples/hello_world.gloin)
          test "$result" = 'Hello World!'
          build-ci-no-tests/gloinc -o build-ci-no-tests/native-hello examples/hello_world.gloin
          result=$(build-ci-no-tests/native-hello)
          test "$result" = 'Hello World!'
          (
            cd build-ci-no-tests
            ./gloinc ../examples/hello_world.gloin
            test -x a.out
            test "$(./a.out)" = 'Hello World!'
          )
          build-ci-no-tests/gloinc --emit-object -o build-ci-no-tests/native-counter.o examples/core_counter.gloin
          "$GLOIN_LLVM_PREFIX/bin/clang++" build-ci-no-tests/native-counter.o build-ci-no-tests/libgloin_runtime.a -o build-ci-no-tests/native-counter
          native_status=0
          build-ci-no-tests/native-counter || native_status=$?
          test "$native_status" -eq 42
          result=$(build-ci-no-tests/gloinc --jit examples/arena_lab.gloin)
          test "$result" = 'arena lab: ok'
          result=$(build-ci-no-tests/gloinc --jit examples/module_lab.gloin)
          test "$result" = 'module lab: ok'
          result=$(printf '42\n' | build-ci-no-tests/gloinc --jit examples/standard_library.gloin)
          expected=$(printf 'Enter decimal i32 values, one per line; EOF finishes:\naccepted: 42\ncount: 1\nsum: 42')
          test "$result" = "$expected"
          result=$(build-ci-no-tests/gloinc --jit examples/strings_lab.gloin)
          expected=$(printf 'count = 42\nstrings lab: ok')
          test "$result" = "$expected"
          result=$(build-ci-no-tests/gloinc --jit examples/text_lab.gloin)
          expected=$(printf 'NAME=Gloin &amp; friends\nEMPTY=\nCOUNT=42\n---done')
          test "$result" = "$expected"

      - name: Build with tests
        id: build
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DLLVM_DIR="$GLOIN_LLVM_PREFIX/lib/cmake/llvm" \
            -DMLIR_DIR="$GLOIN_LLVM_PREFIX/lib/cmake/mlir" \
            2>&1 | tee ci-reports/configure.log
          cmake --build build-ci -j 2 2>&1 | tee ci-reports/build.log
          ctest --test-dir build-ci --show-only=json-v1 > ci-reports/inventory.json

      - name: Check Gloin source style
        run: build-ci/gloinfmt --check .

      - name: Check versioned documentation links
        run: build-ci/gloin-check-docs

      - name: Verify executable core acceptance
        id: core
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          core_status=0
          cmake --build build-ci --target check-core 2>&1 | tee ci-reports/core.log || core_status=$?
          if [[ -f build-ci/core.xml ]]; then cp build-ci/core.xml ci-reports/core.xml; fi
          test "$core_status" -eq 0
          {
            echo '## Executable core acceptance'
            echo 'All required supported-language suites passed from a fresh Release build.'
            echo 'This result is separate from the unfiltered suite and its deferred-feature failures.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify installation and relocated package
        id: package
        if: ${{ !cancelled() && steps.core.outcome == 'success' }}
        run: |
          bash scripts/check-package.sh build-ci ci-reports/package \
            2>&1 | tee ci-reports/package.log

      - name: Build and check with AddressSanitizer and UBSan
        id: sanitized
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build-ci-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DGLOIN_ENABLE_SANITIZERS=ON \
            -DLLVM_DIR="$GLOIN_LLVM_PREFIX/lib/cmake/llvm" \
            -DMLIR_DIR="$GLOIN_LLVM_PREFIX/lib/cmake/mlir" \
            2>&1 | tee ci-reports/sanitized-configure.log
          cmake --build build-ci-sanitized -j 2 2>&1 | tee ci-reports/sanitized-build.log
          test ! -e build-ci-sanitized/CPackConfig.cmake
          cmake --build build-ci-sanitized --target check-core 2>&1 | tee ci-reports/sanitized-core.log
          cp build-ci-sanitized/core.xml ci-reports/sanitized-core.xml

      - name: Run complete suite serially and in parallel
        if: ${{ !cancelled() && steps.sanitized.outcome == 'success' }}
        run: |
          set +e
          ctest --test-dir build-ci -j 1 --output-on-failure \
            --output-junit "$PWD/ci-reports/serial.xml" 2>&1 | tee ci-reports/serial.log
          serial_status=${PIPESTATUS[0]}
          ctest --test-dir build-ci -j 4 --output-on-failure \
            --output-junit "$PWD/ci-reports/parallel.xml" 2>&1 | tee ci-reports/parallel.log
          parallel_status=${PIPESTATUS[0]}
          set -e
          {
            echo '## Complete test suite'
            echo "Serial CTest exit status: $serial_status"
            echo "Parallel CTest exit status: $parallel_status"
            echo 'Download compiler-ci-reports for JUnit results, full logs, and test inventory.'
            echo 'Known language failures remain failures; see tests/README.md for task IDs.'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$serial_status" -ne 0 && test "$parallel_status" -ne 0
          build-ci/gloin-check-suite ci-reports/serial.xml ci-reports/parallel.xml

      - name: Publish build and test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: compiler-ci-reports
          retention-days: 14
          if-no-files-found: error
          path: |
            ci-reports/
            build-ci/Testing/Temporary/
            build-ci/compile_commands.json
            build-ci/CMakeCache.txt
            build-ci-no-tests/CMakeCache.txt
            build-ci-sanitized/core.xml
            build-ci-sanitized/Testing/Temporary/
            build-ci-sanitized/CMakeCache.txt

  release:
    name: Publish validated 0.2.2 packages
    needs: [linux, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'kubabialy/gloinc' && contains(github.event.head_commit.message, '[publish v0.2.2]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Publish packages and validation provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-0.2.2.sh
